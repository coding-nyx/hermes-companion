<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #15151A; color: #E8E8EC; font-family: Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #B3B6F2; text-decoration: none; }
    a:hover { color: #CBCDF8; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #15151A; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 44px; flex-shrink: 0"></div>

  <div style="padding: 4px 16px 10px; display: flex; align-items: center; gap: 11px; flex-shrink: 0">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8E8EC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    <div style="font-size: 22px; line-height: 28px; font-weight: 600">Find your gateway</div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; overflow: hidden">

    <div style="display: flex; gap: 9px; align-items: center">
      <div style="width: 8px; height: 8px; border-radius: 999px; background: {{scanColor}}; animation: {{scanAnim}}; flex-shrink: 0"></div>
      <div style="font-size: 13px; line-height: 18px; color: rgba(232,232,236,0.62); flex-grow: 1">{{scanLabel}}</div>
      <div onClick="{{ rescan }}" style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; border: 1px solid rgba(232,232,236,0.16); color: rgba(232,232,236,0.62); font-size: 12px; font-weight: 500; cursor: pointer">{{scanBtn}}</div>
    </div>

    <sc-for list="{{found}}" as="f" hint-placeholder-count="2">
      <div style="background: #1C1C22; border: 1px solid {{f.border}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; min-height: 48px">
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="font-size: 15px; line-height: 20px; font-weight: 600">{{f.name}}</div>
          <div style="font-size: 11px; line-height: 14px; font-weight: 600; color: {{f.tierColor}}; background: {{f.tierBg}}; border-radius: 999px; padding: 3px 8px">{{f.tier}}</div>
          <div style="flex-grow: 1"></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(232,232,236,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
        <div style="font-size: 12px; line-height: 17px; font-family: 'Roboto Mono', ui-monospace, monospace; color: rgba(232,232,236,0.62)">{{f.addr}}</div>
        <div style="font-size: 11px; line-height: 15px; color: rgba(232,232,236,0.42)">{{f.how}}</div>
      </div>
    </sc-for>

    <div style="min-height: 48px; border-radius: 999px; border: 1px solid rgba(179,182,242,0.5); color: #B3B6F2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; cursor: pointer">Enter an address myself</div>

    <div style="background: #1C1C22; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.7px; text-transform: uppercase; color: rgba(232,232,236,0.40)">Where it looks</div>
      <sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; gap: 9px; align-items: flex-start">
          <div style="font-size: 11px; line-height: 16px; font-family: 'Roboto Mono', ui-monospace, monospace; color: #B3B6F2; width: 74px; flex-shrink: 0">{{m.k}}</div>
          <div style="font-size: 11px; line-height: 16px; color: rgba(232,232,236,0.55); flex-grow: 1">{{m.v}}</div>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="border-left: 2px solid #FFCC80; padding-left: 10px; margin-bottom: 22px">
      <div style="font-size: 12px; line-height: 17px; color: rgba(232,232,236,0.62)">Discovery only proves something answered on that address. Nothing is trusted until you check its fingerprint on the next screen.</div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scanning: false };
  }
  renderVals() {
    const scanning = this.state.scanning;
    const all = [
      {
        name: 'mac-studio', addr: 'mac-studio.local:7800', tier: 'wss',
        tierColor: '#80CBC4', tierBg: 'rgba(128,203,196,0.14)',
        border: 'rgba(128,203,196,0.30)',
        how: 'This Wi-Fi, over mDNS · _hermes._tcp.local',
      },
      {
        name: 'studio-cloud', addr: 'mac-studio.tail9f2c.ts.net:7800', tier: 'wss',
        tierColor: '#80CBC4', tierBg: 'rgba(128,203,196,0.14)',
        border: 'rgba(232,232,236,0.12)',
        how: 'Your tailnet, over wide-area DNS-SD',
      },
      {
        name: 'pi-shed', addr: 'pi-shed.local:7800', tier: 'ws · limited',
        tierColor: '#FFCC80', tierBg: 'rgba(255,204,128,0.14)',
        border: 'rgba(232,232,236,0.12)',
        how: 'This Wi-Fi, cleartext only — chat, never a node',
      },
    ];
    return {
      found: scanning ? all.slice(0, 1) : all,
      scanning,
      scanColor: scanning ? '#B3B6F2' : '#80CBC4',
      scanAnim: scanning ? 'pulse 1.1s ease-in-out infinite' : 'none',
      scanLabel: scanning ? 'Looking on this Wi-Fi and your tailnet…' : '3 gateways answered',
      scanBtn: scanning ? 'Stop' : 'Scan again',
      methods: [
        { k: 'mDNS', v: 'Same Wi-Fi, no configuration' },
        { k: 'DNS-SD', v: 'Across your tailnet, wherever the phone is' },
        { k: 'manual', v: 'Anything reachable — SSH tunnels, Cloud, odd ports' },
      ],
      rescan: () => this.setState({ scanning: !this.state.scanning }),
    };
  }
}
</script>
</body>
</html>
