<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #15151A; color: #E8E8EC; font-family: Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #B3B6F2; text-decoration: none; }
    a:hover { color: #CBCDF8; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #15151A; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 44px; flex-shrink: 0"></div>

  <div style="padding: 4px 16px 10px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8E8EC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M11 6l-6 6 6 6"></path>
    </svg>
    <div style="font-size: 22px; line-height: 28px; font-weight: 600">Capabilities</div>
  </div>

  <div style="padding: 0 16px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 6px; background: #1C1C22; border: 1px solid rgba(232,232,236,0.12); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-family: 'Roboto Mono', ui-monospace, monospace">
      <span style="color: rgba(232,232,236,0.62)">gw-home</span>
      <span style="color: rgba(232,232,236,0.30)">›</span>
      <span style="color: #B3B6F2">@{{profile}}</span>
      <span style="color: rgba(232,232,236,0.30)">›</span>
      <span style="color: rgba(232,232,236,0.62)">node_s22</span>
    </div>
    <div style="display: flex; gap: 6px">
      <sc-for list="{{profiles}}" as="p" hint-placeholder-count="2">
        <div onClick="{{ p.pick }}" style="min-height: 44px; flex-grow: 1; display: flex; align-items: center; justify-content: center; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; background: {{p.bg}}; color: {{p.fg}}; border: 1px solid {{p.bd}}">{{p.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; overflow: hidden">

    <sc-for list="{{groups}}" as="grp" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.7px; text-transform: uppercase; color: {{grp.color}}">{{grp.title}}</div>
          <div style="height: 1px; flex-grow: 1; background: rgba(232,232,236,0.12)"></div>
        </div>
        <sc-for list="{{grp.items}}" as="c" hint-placeholder-count="4">
          <div onClick="{{ c.cycle }}" style="background: #1C1C22; border: 1px solid {{c.border}}; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 48px">
            <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
              <div style="font-size: 13px; line-height: 18px; font-family: 'Roboto Mono', ui-monospace, monospace; color: #E8E8EC">{{c.id}}</div>
              <div style="font-size: 12px; line-height: 16px; color: rgba(232,232,236,0.40)">{{c.note}}</div>
            </div>
            <div style="font-size: 11px; line-height: 14px; font-weight: 600; color: {{c.modeColor}}; background: {{c.modeBg}}; border-radius: 999px; padding: 5px 9px; flex-shrink: 0; white-space: nowrap">{{c.mode}}</div>
          </div>
        </sc-for>
      </div>
    </sc-for>

    <div style="background: #1C1C22; border-left: 2px solid #FFCC80; border-radius: 4px; padding: 10px 12px; margin-bottom: 20px">
      <div style="font-size: 12px; line-height: 17px; color: rgba(232,232,236,0.62)">Grants are per gateway, profile, node and capability — never global. Hermes' own approval policy still runs on top. This app is a transport, not a way around it.</div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      profile: 'ash',
      modes: {
        'ash|notifications.read': 1,
        'ash|calls.observe': 1,
        'ash|device.status': 1,
        'ash|contacts.lookup': 2,
        'ash|notifications.reply': 2,
        'ash|calls.reject': 2,
        'ash|apps.launch': 3,
        'ash|messages.sms.send': 0,
        'misty|notifications.read': 0,
        'misty|calls.observe': 0,
        'misty|device.status': 1,
        'misty|contacts.lookup': 0,
        'misty|notifications.reply': 0,
        'misty|calls.reject': 0,
        'misty|apps.launch': 0,
        'misty|messages.sms.send': 0,
      },
    };
    this.MODES = [
      { label: 'Deny', color: 'rgba(232,232,236,0.40)', bg: 'rgba(232,232,236,0.07)', border: 'rgba(232,232,236,0.12)' },
      { label: 'Allowed', color: '#80CBC4', bg: 'rgba(128,203,196,0.14)', border: 'rgba(128,203,196,0.30)' },
      { label: 'Ask each time', color: '#FFCC80', bg: 'rgba(255,204,128,0.14)', border: 'rgba(255,204,128,0.30)' },
      { label: 'While unlocked', color: '#B3B6F2', bg: 'rgba(179,182,242,0.14)', border: 'rgba(179,182,242,0.30)' },
    ];
  }
  renderVals() {
    const profile = this.state.profile;
    const modes = this.state.modes;
    const M = this.MODES;

    const profiles = [
      { id: 'ash', label: '@ash' },
      { id: 'misty', label: '@misty' },
    ].map((p) => ({
      label: p.label,
      bg: profile === p.id ? 'rgba(179,182,242,0.16)' : '#1C1C22',
      fg: profile === p.id ? '#B3B6F2' : 'rgba(232,232,236,0.62)',
      bd: profile === p.id ? 'rgba(179,182,242,0.55)' : 'rgba(232,232,236,0.12)',
      pick: () => this.setState({ profile: p.id }),
    }));

    const build = (id, note) => {
      const key = profile + '|' + id;
      const idx = modes[key] || 0;
      const m = M[idx];
      return {
        id,
        note,
        mode: m.label,
        modeColor: m.color,
        modeBg: m.bg,
        border: m.border,
        cycle: () => {
          const next = Object.assign({}, this.state.modes);
          next[key] = (idx + 1) % M.length;
          this.setState({ modes: next });
        },
      };
    };

    const groups = [
      {
        title: 'Read only',
        color: '#80CBC4',
        items: [
          build('notifications.read', 'Package, title, preview'),
          build('calls.observe', 'Ringing, answered, missed, blocked'),
          build('device.status', 'Battery, network, thermal, storage'),
          build('contacts.lookup', 'Resolve a number to a name'),
        ],
      },
      {
        title: 'Mutating',
        color: '#FFCC80',
        items: [
          build('notifications.reply', 'Send into a thread from a notification'),
          build('calls.reject', 'Needs the call-screening role'),
          build('apps.launch', 'Open an app or deep link'),
          build('messages.sms.send', 'Needs the SMS role'),
        ],
      },
    ];

    return { profile, profiles, groups };
  }
}
</script>
</body>
</html>
