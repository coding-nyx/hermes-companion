<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #15151A; color: #E8E8EC; font-family: Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .mono { font-family: 'Roboto Mono', ui-monospace, monospace; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0C0C10; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 8px 12px 0; font-size: 11px; letter-spacing: 1px; color: rgba(232,232,236,0.3)">FLEET SWITCHER · WIREFRAME</div>
  <div style="flex: 1"></div>
  <!-- bottom sheet -->
  <div style="background: #15151A; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 12px; max-height: 640px">
    <div style="width: 36px; height: 4px; border-radius: 999px; background: rgba(232,232,236,0.2); align-self: center"></div>
    <div style="font-size: 18px; font-weight: 600">Switch route</div>

    <!-- gateway: home -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #80CBC4"></div>
        <div style="font-size: 15px; font-weight: 600; flex: 1">Home</div>
        <div style="font-size: 11px; font-weight: 500; color: #80CBC4; background: rgba(128,203,196,0.14); border-radius: 999px; padding: 3px 8px">Healthy 11ms</div>
        <div class="mono" style="font-size: 10px; color: rgba(232,232,236,0.4)">full</div>
      </div>
      <div style="margin-left: 16px; display: flex; flex-direction: column; gap: 6px">
        <div class="mono" style="font-size: 13px; color: #B3B6F2">@ash <span style="font-family: Roboto; font-size: 11px; color: rgba(232,232,236,0.4)">· returns to Morning triage</span></div>
        <div style="background: #1C1C22; border: 1px solid rgba(179,182,242,0.4); border-radius: 10px; padding: 9px 11px; display: flex; align-items: center; gap: 8px">
          <div style="flex: 1"><div style="font-size: 13px">Morning triage</div><div class="mono" style="font-size: 10px; color: rgba(232,232,236,0.4)">…f3a-c418</div></div>
          <div style="font-size: 11px; color: #FFCC80">streaming</div>
        </div>
        <div style="background: #1C1C22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 9px 11px; display: flex; align-items: center; gap: 8px">
          <div style="flex: 1"><div style="font-size: 13px">Deploy check</div><div class="mono" style="font-size: 10px; color: rgba(232,232,236,0.4)">…7c1e-90</div></div>
          <div style="font-size: 11px; color: rgba(232,232,236,0.4)">idle · 2</div>
        </div>
        <div class="mono" style="font-size: 13px; color: #B3B6F2; margin-top: 2px">@misty</div>
        <div style="background: #1C1C22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 9px 11px"><div style="font-size: 13px">Reading list</div></div>
      </div>
    </div>

    <!-- gateway: cloud (degraded) -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #FFCC80"></div>
        <div style="font-size: 15px; font-weight: 600; flex: 1">Cloud</div>
        <div style="font-size: 11px; font-weight: 500; color: #FFCC80; background: rgba(255,204,128,0.14); border-radius: 999px; padding: 3px 8px">Degraded · stale 4m</div>
        <div class="mono" style="font-size: 10px; color: rgba(232,232,236,0.4)">full</div>
      </div>
      <div style="margin-left: 16px; font-size: 11.5px; color: rgba(232,232,236,0.45)">Its own queue, its own clock — routes are never merged across an outage.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
